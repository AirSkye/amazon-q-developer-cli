name: Build Windows Version

on:
  # 当代码推送到 main 分支时触发工作流
  push:
    branches:
      - main
  # 允许你从 Actions 选项卡手动运行此工作流
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 检出代码到工作区
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装 Rust 工具链
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      # 编译项目
      - name: Build project
        run: cargo build --target x86_64-pc-windows-msvc

      # 可选：上传编译产物作为工件
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: amazon-q-windows-build
          path: target/x86_64-pc-windows-msvc/debug/amazon-q.exe
